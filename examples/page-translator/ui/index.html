<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Page Translator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <details id="settingsBox">
      <summary>Configurações</summary>
      <div class="settingsBody">
        <label for="geminiApiKey">Chave da API do Gemini (opcional)</label>
        <input id="geminiApiKey" type="password" placeholder="Deixe em branco pra usar só o tradutor gratuito" />
        <p class="hint">
          Sem chave: traduz o roteiro que já existir na página, via tradutor
          gratuito. Com chave: lê e traduz direto da imagem de cada
          balão/texto detectado - funciona mesmo sem nenhum roteiro ainda.
          Consiga uma chave em <span class="mono">aistudio.google.com/apikey</span>.
        </p>

        <label for="targetLang">Idioma de destino</label>
        <input id="targetLang" type="text" placeholder="ex: en, pt, es, ja" />

        <label for="geminiModel">Modelo Gemini (opcional)</label>
        <input id="geminiModel" type="text" placeholder="em branco = Flash mais recente" />

        <div class="actions">
          <button id="btnSaveSettings">Salvar configurações</button>
          <span id="settingsStatus" class="status"></span>
        </div>
      </div>
    </details>

    <div class="pageHeader">
      <span id="pageLabel">Página: -</span>
      <button id="btnReload" class="ghost" title="Recarregar com a página atual do editor">Recarregar</button>
    </div>

    <div class="columns">
      <div class="col">
        <label>Roteiro atual (script.traw) - somente leitura</label>
        <textarea id="scriptView" readonly placeholder="(sem roteiro ainda nesta página)"></textarea>
      </div>
      <div class="col">
        <label>Rascunho de tradução (translate.traw) - editável</label>
        <textarea id="draftView" placeholder="(sem rascunho ainda - clique em Traduzir)"></textarea>
      </div>
    </div>

    <div class="actions main">
      <button id="btnTranslate">Traduzir esta página</button>
      <button id="btnSaveDraft" class="secondary">Salvar rascunho</button>
      <button id="btnConfirm" class="confirm">Confirmar → aplicar no roteiro</button>
    </div>
    <p id="mainStatus" class="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
